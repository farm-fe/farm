name: Call reviewed release proof signer
on:
  workflow_call:
    inputs:
      scope:
        required: true
        type: string
      cargo_restored:
        type: boolean
        default: false
      upload_bindings:
        required: true
        type: string
permissions: {}
jobs:
  sign:
    if: github.repository == 'farm-fe/farm' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/release-provenance-signer.yaml
    with:
      scope: ${{ inputs.scope }}
      cargo_restored: ${{ inputs.cargo_restored }}
      upload_bindings: ${{ inputs.upload_bindings }}
