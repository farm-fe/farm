name: Fixed independent release public consumers
on:
  workflow_call:
    inputs:
      candidate_attempt:
        required: true
        type: string
    outputs:
      linux_artifact_id:
        value: ${{ jobs.linux.outputs.artifact_id }}
      linux_artifact_digest:
        value: ${{ jobs.linux.outputs.artifact_digest }}
      linux_run_attempt:
        value: ${{ jobs.linux.outputs.run_attempt }}
      macos_artifact_id:
        value: ${{ jobs.macos.outputs.artifact_id }}
      macos_artifact_digest:
        value: ${{ jobs.macos.outputs.artifact_digest }}
      macos_run_attempt:
        value: ${{ jobs.macos.outputs.run_attempt }}
      windows_artifact_id:
        value: ${{ jobs.windows.outputs.artifact_id }}
      windows_artifact_digest:
        value: ${{ jobs.windows.outputs.artifact_digest }}
      windows_run_attempt:
        value: ${{ jobs.windows.outputs.run_attempt }}
permissions:
  contents: read
  actions: read
jobs:
  linux:
    name: Independent public registry consumer (ubuntu-24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v4
        with:
          name: farm-release-candidates-${{ github.sha }}-${{ inputs.candidate_attempt }}
          path: release-candidate
      - run: rustup toolchain install nightly-2026-04-10 --profile minimal
      - name: Install public originals with no workspace or publish credentials
        env:
          FARM_RELEASE_CANDIDATE_DIRECTORY: ${{ github.workspace }}/release-candidate
        run: node scripts/verify-published-v2-consumers.mjs
      - name: Record actual consumer attempt
        shell: python
        env:
          PUBLIC_PLATFORM: ubuntu-24.04
        run: |
          import hashlib, json, os
          from pathlib import Path
          manifest = json.loads(Path('release-candidate/manifest.json').read_text(encoding='utf-8'))
          attempt = int(os.environ['GITHUB_RUN_ATTEMPT'])
          report = Path('release-candidate/public-consumer/attempt-' + str(attempt) + '/result.json')
          result = json.loads(report.read_text(encoding='utf-8'))
          assert result.get('status') == 'passed' and result.get('cleanupConfirmed') is True
          result['publicationBinding'] = {'manifestHash': hashlib.sha256(json.dumps(manifest, sort_keys=True, separators=(',', ':')).encode()).hexdigest(),
            'sourceSHA': manifest['sourceSHA'], 'sourceTree': manifest['sourceTree'], 'producerRunId': manifest['producerRunId'],
            'producerAttempt': manifest['producerAttempt'], 'consumerRunId': int(os.environ['GITHUB_RUN_ID']),
            'consumerAttempt': attempt, 'platform': os.environ['PUBLIC_PLATFORM']}
          report.write_text(json.dumps(result, sort_keys=True) + '\n', encoding='utf-8')
      - name: Upload independent public consumer report
        uses: actions/upload-artifact@v4
        with:
          name: release-public-ubuntu-24.04-${{ github.run_attempt }}
          path: release-candidate/public-consumer/attempt-${{ github.run_attempt }}/result.json
          if-no-files-found: error
          retention-days: 90
        id: receipt-upload
      - name: Bind receipt to its actual executing attempt
        id: receipt-origin
        shell: python
        run: |
          import os
          from pathlib import Path
          with Path(os.environ['GITHUB_OUTPUT']).open('a') as stream:
              stream.write('attempt=' + os.environ['GITHUB_RUN_ATTEMPT'] + '\n')
    outputs:
      artifact_id: ${{ steps.receipt-upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.receipt-upload.outputs.artifact-digest }}
      run_attempt: ${{ steps.receipt-origin.outputs.attempt }}
  macos:
