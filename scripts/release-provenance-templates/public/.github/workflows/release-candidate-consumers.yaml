name: Fixed independent release candidate consumers
on:
  workflow_call:
    inputs:
      candidate_attempt:
        required: true
        type: string
    outputs:
      linux_artifact_id:
        value: ${{ jobs.linux.outputs.artifact_id }}
      linux_artifact_digest:
        value: ${{ jobs.linux.outputs.artifact_digest }}
      linux_run_attempt:
        value: ${{ jobs.linux.outputs.run_attempt }}
      macos_artifact_id:
        value: ${{ jobs.macos.outputs.artifact_id }}
      macos_artifact_digest:
        value: ${{ jobs.macos.outputs.artifact_digest }}
      macos_run_attempt:
        value: ${{ jobs.macos.outputs.run_attempt }}
      windows_artifact_id:
        value: ${{ jobs.windows.outputs.artifact_id }}
      windows_artifact_digest:
        value: ${{ jobs.windows.outputs.artifact_digest }}
      windows_run_attempt:
        value: ${{ jobs.windows.outputs.run_attempt }}
permissions:
  contents: read
  actions: read
jobs:
  linux:
    name: Independent release candidate consumer (ubuntu-24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
      - uses: actions/download-artifact@v4
        with:
          name: farm-release-candidates-${{ github.sha }}-${{ inputs.candidate_attempt }}
          path: release-candidate
      - run: node scripts/verify-v2-npm-consumer.mjs release-candidate candidate-results
      - name: Upload independent release candidate acceptance
        uses: actions/upload-artifact@v4
        with:
          name: farm-release-candidate-consumer-${{ github.sha }}-ubuntu-24.04-${{ github.run_attempt }}
          path: candidate-results/result.json
          if-no-files-found: error
          retention-days: 90
        id: receipt-upload
      - name: Bind receipt to its actual executing attempt
        id: receipt-origin
        shell: python
        run: |
          import os
          from pathlib import Path
          with Path(os.environ['GITHUB_OUTPUT']).open('a') as stream:
              stream.write('attempt=' + os.environ['GITHUB_RUN_ATTEMPT'] + '\n')
    outputs:
      artifact_id: ${{ steps.receipt-upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.receipt-upload.outputs.artifact-digest }}
      run_attempt: ${{ steps.receipt-origin.outputs.attempt }}
  macos:
    name: Independent release candidate consumer (macos-latest)
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
      - uses: actions/download-artifact@v4
        with:
          name: farm-release-candidates-${{ github.sha }}-${{ inputs.candidate_attempt }}
          path: release-candidate
      - run: node scripts/verify-v2-npm-consumer.mjs release-candidate candidate-results
      - name: Upload independent release candidate acceptance
        uses: actions/upload-artifact@v4
        with:
          name: farm-release-candidate-consumer-${{ github.sha }}-macos-latest-${{ github.run_attempt }}
          path: candidate-results/result.json
          if-no-files-found: error
          retention-days: 90
        id: receipt-upload
      - name: Bind receipt to its actual executing attempt
        id: receipt-origin
        shell: python
        run: |
          import os
          from pathlib import Path
          with Path(os.environ['GITHUB_OUTPUT']).open('a') as stream:
              stream.write('attempt=' + os.environ['GITHUB_RUN_ATTEMPT'] + '\n')
    outputs:
      artifact_id: ${{ steps.receipt-upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.receipt-upload.outputs.artifact-digest }}
      run_attempt: ${{ steps.receipt-origin.outputs.attempt }}
  windows:
    name: Independent release candidate consumer (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
      - uses: actions/download-artifact@v4
        with:
          name: farm-release-candidates-${{ github.sha }}-${{ inputs.candidate_attempt }}
          path: release-candidate
      - run: node scripts/verify-v2-npm-consumer.mjs release-candidate candidate-results
      - name: Upload independent release candidate acceptance
        uses: actions/upload-artifact@v4
        with:
          name: farm-release-candidate-consumer-${{ github.sha }}-windows-latest-${{ github.run_attempt }}
          path: candidate-results/result.json
          if-no-files-found: error
          retention-days: 90
        id: receipt-upload
      - name: Bind receipt to its actual executing attempt
        id: receipt-origin
        shell: python
        run: |
          import os
          from pathlib import Path
          with Path(os.environ['GITHUB_OUTPUT']).open('a') as stream:
              stream.write('attempt=' + os.environ['GITHUB_RUN_ATTEMPT'] + '\n')
    outputs:
      artifact_id: ${{ steps.receipt-upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.receipt-upload.outputs.artifact-digest }}
      run_attempt: ${{ steps.receipt-origin.outputs.attempt }}
