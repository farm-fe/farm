[package]
name = "farmfe_plugin_docs_snippets"
version = "0.0.1"
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
farmfe_core = { version = "=3.0.0", path = "../../crates/core" }
farmfe_toolkit = { version = "=3.0.0", path = "../../crates/toolkit" }
farmfe_macro_plugin = { version = "=2.0.0", path = "../../crates/macro_plugin" }
farmfe_syntax_highlight = { path = "../../rust-ecosystem/syntax-highlight" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
farmfe_docs_content = { path = "../../rust-ecosystem/docs-content" }
mdxjs = { version = "1.0.4", features = ["serializable"] }
markdown = "1"
sha2 = "0.10"
