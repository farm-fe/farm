[package]
name = "fervid_parser"
description = "Vue SFC parser for the fervid crate"
version = "0.2.0"
edition = "2024"
authors = ["Marsel Shaikhin <phoenix.apps@yahoo.com>"]
repository = "https://github.com/phoenix-ru/fervid"
license = "Apache-2.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
fervid_core = { version = "0.2.0", git = "https://github.com/phoenix-ru/fervid.git", rev = "4f26ab48f81eb9688fb84e9fa14541373d5bca7d" }
swc_core = { version = "35", features = ["common", "ecma_ast"] }
swc_ecma_parser = "22"
swc_html_ast = "14"
swc_html_parser = "14"
