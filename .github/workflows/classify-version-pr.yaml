name: Classify version preparation
on:
  workflow_call:
    inputs:
      pr_number:
        type: string
        default: ''
    outputs:
      mode:
        value: ${{ jobs.classify.outputs.mode }}
      proof_hash:
        value: ${{ jobs.classify.outputs.proof_hash }}
permissions:
  contents: read
  actions: read
jobs:
  classify:
    name: Verify pure Changesets version preparation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      mode: ${{ steps.classify.outputs.mode }}
      proof_hash: ${{ steps.classify.outputs.proof_hash }}
    steps:
      # Classifier and its dependencies always come from the protected main
      # policy, never from executable code supplied by the PR being classified.
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 0
      - id: available
        run: |
          if [ -f scripts/changesets-version-runtime.mjs ]; then echo 'present=true' >> "$GITHUB_OUTPUT"; fi
      - uses: pnpm/action-setup@v4
        if: steps.available.outputs.present == 'true'
        with:
          version: 9.4.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pnpm install --frozen-lockfile --ignore-scripts
        if: steps.available.outputs.present == 'true'
      - id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_PR: ${{ inputs.pr_number }}
        run: |
          if [ -f scripts/changesets-version-runtime.mjs ]; then
            node scripts/changesets-version-runtime.mjs
          else
            echo 'mode=full' >> "$GITHUB_OUTPUT"
            echo 'Protected main has no classifier yet; bootstrap uses normal CI.'
          fi
