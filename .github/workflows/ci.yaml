name: E2E Tests
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Exact same-repository PR to validate at its current head
        required: true
        type: string
      base_sha:
        description: Exact current PR base SHA
        required: true
        type: string
  pull_request:
    branches:
      - main
      - codex/v2-unified-release-20261025

env:
  GH_TOKEN: ${{ github.token }}

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.event.pull_request.number || inputs.pr_number || (github.ref == 'refs/heads/main' && github.sha || github.ref) }}
  cancel-in-progress: true

jobs:
  version-classification:
    uses: ./.github/workflows/classify-version-pr.yaml
    permissions:
      contents: read
      actions: read
    with:
      pr_number: ${{ inputs.pr_number || '' }}

  impact-plan:
    outputs:
      artifact_id: ${{ steps.plan-upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.plan-upload.outputs.artifact-digest }}
      run_attempt: ${{ steps.plan-origin.outputs.attempt }}

    needs: [version-classification]
    name: Incremental CI plan (shadow only)
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check conservative planning and producer proof contracts
        run: |
          python scripts/ci-impact-plan.test.py
          python scripts/ci-native-proof.test.py
          python scripts/ci-native-evidence.test.py
          python scripts/ci-native-source-graph.test.py
          python scripts/ci-source-plan.test.py
          python scripts/ci-e2e-shadow-inputs.test.py
          python scripts/ci-impact-receipt.test.py
      - name: Compute committed base and head impact without changing execution
        run: python scripts/ci-impact-plan.py --output impact-plan/plan.json
      - id: plan-origin
        run: echo "attempt=$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - id: plan-upload
        name: Upload fixed source impact plan
        uses: actions/upload-artifact@v4
        with:
          name: impact-plan-${{ github.sha }}-${{ github.run_attempt }}
          path: impact-plan/plan.json
          if-no-files-found: error
          retention-days: 14
      - name: Discover suite files without selecting or executing them
        continue-on-error: true
        run: node scripts/ci-suite-inventory.mjs --output suite-inventory/inventory.json
      - name: Preserve discovery-only suite inventory
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: suite-inventory-${{ github.sha }}-${{ github.run_attempt }}
          path: suite-inventory/inventory.json
          if-no-files-found: warn
          retention-days: 14

  impact-summary:
    name: Incremental CI shadow summary
    continue-on-error: true
    permissions:
      contents: read
      actions: read
    if: (always())
    needs: [platform-contract-linux, platform-contract-macos, platform-contract-windows, version-classification, primary-linux, primary-macos, primary-windows, impact-plan, release-contract-tests, platform-contract-tests, call-rust-build-user, call-rust-build-release, check-native-candidate-assembly, examples-test, docs-acceptance, type-check, ts-test, execution-baseline]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Report actual results without inheriting old acceptance
        if: always()
        env:
          CI_E2E_RESOLVE_ORIGINAL_ATTEMPTS: 'true'
          CI_E2E_UPLOADS: >-
            {"planner":{"artifact_id":"${{ needs.impact-plan.outputs.artifact_id }}","artifact_digest":"${{ needs.impact-plan.outputs.artifact_digest }}","run_attempt":"${{ needs.impact-plan.outputs.run_attempt }}"},
             "native:ci:linux-x64-gnu":{"artifact_id":"${{ needs.primary-linux.outputs.native_shadow_artifact_id }}","artifact_digest":"${{ needs.primary-linux.outputs.native_shadow_artifact_digest }}","run_attempt":"${{ needs.primary-linux.outputs.native_shadow_run_attempt }}"},
             "ts-tests:linux-x64-gnu":{"artifact_id":"${{ needs.primary-linux.outputs.ts_shadow_artifact_id }}","artifact_digest":"${{ needs.primary-linux.outputs.ts_shadow_artifact_digest }}","run_attempt":"${{ needs.primary-linux.outputs.ts_shadow_run_attempt }}"},
             "examples:linux-x64-gnu":{"artifact_id":"${{ needs.primary-linux.outputs.browser_shadow_artifact_id }}","artifact_digest":"${{ needs.primary-linux.outputs.browser_shadow_artifact_digest }}","run_attempt":"${{ needs.primary-linux.outputs.browser_shadow_run_attempt }}"},
             "docs:ci:linux-x64-gnu":{"artifact_id":"${{ needs.primary-linux.outputs.docs_shadow_artifact_id }}","artifact_digest":"${{ needs.primary-linux.outputs.docs_shadow_artifact_digest }}","run_attempt":"${{ needs.primary-linux.outputs.docs_shadow_run_attempt }}"},
             "platform-contracts:linux-x64-gnu":{"artifact_id":"${{ needs.platform-contract-linux.outputs.artifact_id }}","artifact_digest":"${{ needs.platform-contract-linux.outputs.artifact_digest }}","run_attempt":"${{ needs.platform-contract-linux.outputs.run_attempt }}"},
             "native:ci:darwin-arm64":{"artifact_id":"${{ needs.primary-macos.outputs.native_shadow_artifact_id }}","artifact_digest":"${{ needs.primary-macos.outputs.native_shadow_artifact_digest }}","run_attempt":"${{ needs.primary-macos.outputs.native_shadow_run_attempt }}"},
             "ts-tests:darwin-arm64":{"artifact_id":"${{ needs.primary-macos.outputs.ts_shadow_artifact_id }}","artifact_digest":"${{ needs.primary-macos.outputs.ts_shadow_artifact_digest }}","run_attempt":"${{ needs.primary-macos.outputs.ts_shadow_run_attempt }}"},
             "examples:darwin-arm64":{"artifact_id":"${{ needs.primary-macos.outputs.browser_shadow_artifact_id }}","artifact_digest":"${{ needs.primary-macos.outputs.browser_shadow_artifact_digest }}","run_attempt":"${{ needs.primary-macos.outputs.browser_shadow_run_attempt }}"},
             "platform-contracts:darwin-arm64":{"artifact_id":"${{ needs.platform-contract-macos.outputs.artifact_id }}","artifact_digest":"${{ needs.platform-contract-macos.outputs.artifact_digest }}","run_attempt":"${{ needs.platform-contract-macos.outputs.run_attempt }}"},
             "native:ci:win32-x64-msvc":{"artifact_id":"${{ needs.primary-windows.outputs.native_shadow_artifact_id }}","artifact_digest":"${{ needs.primary-windows.outputs.native_shadow_artifact_digest }}","run_attempt":"${{ needs.primary-windows.outputs.native_shadow_run_attempt }}"},
             "ts-tests:win32-x64-msvc":{"artifact_id":"${{ needs.primary-windows.outputs.ts_shadow_artifact_id }}","artifact_digest":"${{ needs.primary-windows.outputs.ts_shadow_artifact_digest }}","run_attempt":"${{ needs.primary-windows.outputs.ts_shadow_run_attempt }}"},
             "examples:win32-x64-msvc":{"artifact_id":"${{ needs.primary-windows.outputs.browser_shadow_artifact_id }}","artifact_digest":"${{ needs.primary-windows.outputs.browser_shadow_artifact_digest }}","run_attempt":"${{ needs.primary-windows.outputs.browser_shadow_run_attempt }}"},
             "docs:ci:win32-x64-msvc":{"artifact_id":"${{ needs.primary-windows.outputs.docs_shadow_artifact_id }}","artifact_digest":"${{ needs.primary-windows.outputs.docs_shadow_artifact_digest }}","run_attempt":"${{ needs.primary-windows.outputs.docs_shadow_run_attempt }}"},
             "platform-contracts:win32-x64-msvc":{"artifact_id":"${{ needs.platform-contract-windows.outputs.artifact_id }}","artifact_digest":"${{ needs.platform-contract-windows.outputs.artifact_digest }}","run_attempt":"${{ needs.platform-contract-windows.outputs.run_attempt }}"},
             "native:ci:linux-x64-musl":{"artifact_id":"${{ needs.call-rust-build-release.outputs.linux_x64_musl_artifact_id }}","artifact_digest":"${{ needs.call-rust-build-release.outputs.linux_x64_musl_artifact_digest }}","run_attempt":"${{ needs.call-rust-build-release.outputs.linux_x64_musl_run_attempt }}"},
             "native:ci:darwin-x64":{"artifact_id":"${{ needs.call-rust-build-release.outputs.darwin_x64_artifact_id }}","artifact_digest":"${{ needs.call-rust-build-release.outputs.darwin_x64_artifact_digest }}","run_attempt":"${{ needs.call-rust-build-release.outputs.darwin_x64_run_attempt }}"},
             "native:ci:win32-ia32-msvc":{"artifact_id":"${{ needs.call-rust-build-release.outputs.win32_ia32_msvc_artifact_id }}","artifact_digest":"${{ needs.call-rust-build-release.outputs.win32_ia32_msvc_artifact_digest }}","run_attempt":"${{ needs.call-rust-build-release.outputs.win32_ia32_msvc_run_attempt }}"},
             "native:ci:win32-arm64-msvc":{"artifact_id":"${{ needs.call-rust-build-release.outputs.win32_arm64_msvc_artifact_id }}","artifact_digest":"${{ needs.call-rust-build-release.outputs.win32_arm64_msvc_artifact_digest }}","run_attempt":"${{ needs.call-rust-build-release.outputs.win32_arm64_msvc_run_attempt }}"},
             "native:ci:linux-arm64-musl":{"artifact_id":"${{ needs.call-rust-build-release.outputs.linux_arm64_musl_artifact_id }}","artifact_digest":"${{ needs.call-rust-build-release.outputs.linux_arm64_musl_artifact_digest }}","run_attempt":"${{ needs.call-rust-build-release.outputs.linux_arm64_musl_run_attempt }}"},
             "native:ci:linux-arm64-gnu":{"artifact_id":"${{ needs.call-rust-build-release.outputs.linux_arm64_gnu_artifact_id }}","artifact_digest":"${{ needs.call-rust-build-release.outputs.linux_arm64_gnu_artifact_digest }}","run_attempt":"${{ needs.call-rust-build-release.outputs.linux_arm64_gnu_run_attempt }}"},
             "types":{"artifact_id":"${{ needs.type-check.outputs.artifact_id }}","artifact_digest":"${{ needs.type-check.outputs.artifact_digest }}","run_attempt":"${{ needs.type-check.outputs.run_attempt }}"},
             "contracts":{"artifact_id":"${{ needs.release-contract-tests.outputs.artifact_id }}","artifact_digest":"${{ needs.release-contract-tests.outputs.artifact_digest }}","run_attempt":"${{ needs.release-contract-tests.outputs.run_attempt }}"},
             "native-assembly":{"artifact_id":"${{ needs.check-native-candidate-assembly.outputs.artifact_id }}","artifact_digest":"${{ needs.check-native-candidate-assembly.outputs.artifact_digest }}","run_attempt":"${{ needs.check-native-candidate-assembly.outputs.run_attempt }}"},
             "execution-baseline":{"artifact_id":"${{ needs.execution-baseline.outputs.artifact_id }}","artifact_digest":"${{ needs.execution-baseline.outputs.artifact_digest }}","run_attempt":"${{ needs.execution-baseline.outputs.run_attempt }}"}}
          CI_IMPACT_SCOPE: e2e
          CI_SHADOW_UPLOADS_LINUX: ${{ toJSON(needs.primary-linux.outputs) }}
          CI_SHADOW_UPLOADS_MACOS: ${{ toJSON(needs.primary-macos.outputs) }}
          CI_SHADOW_UPLOADS_WINDOWS: ${{ toJSON(needs.primary-windows.outputs) }}
          CI_IMPACT_NEEDS: ${{ toJSON(needs) }}
        run: python scripts/ci-impact-summary.py --plan impact-plan/plan.json --receipts impact-cell-receipts --output impact-summary/summary.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: impact-summary-${{ github.sha }}-${{ github.run_attempt }}
          path: impact-summary/summary.json
          if-no-files-found: warn
          retention-days: 14

  release-contract-tests:
    outputs:
      artifact_id: ${{ steps.shadow-upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.shadow-upload.outputs.artifact-digest }}
      run_attempt: ${{ steps.shadow-upload.outputs.run-attempt }}

    needs: [version-classification]
    name: Release source contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9.4.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Check spelling before native builds
        run: pnpm exec cspell "**" --gitignore
      - name: Check native routing and container entry contracts without compiling
        run: |
          node --test scripts/native-artifact-inventory.test.mjs
          node scripts/test-native-container-node.cjs
          node scripts/test-native-artifact-flow.cjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check cold-cache Cargo packaging against public dependency sources
        env:
          FARM_CARGO_NETWORK_TESTS: '1'
        run: |
          rustup toolchain install nightly-2026-04-10 --profile minimal
          python -B scripts/cargo-public-sources.test.py
      - name: Check independent CI and release selection contracts
        run: |
          node --test scripts/ci-local-performance-policy.test.mjs scripts/ci-reusable-permissions.test.mjs scripts/ci-required-dag.test.mjs scripts/native-checkout-contract.test.mjs scripts/formal-native-scope.test.mjs
          node --test scripts/automatic-release-source.test.mjs scripts/main-registry-source.test.mjs
          python -B scripts/formal-native-products.test.py
          python -B scripts/cargo-prepared-family.test.py
          python -B scripts/cargo-source-release.test.py
          python -B scripts/release-registry-selection.test.py
          python scripts/incremental-chain-plan.test.py
          python scripts/ci-leaf-native.test.py
          node --test scripts/ci-leaf-assembly.test.mjs
          python scripts/incremental-scheduling-model.test.py
          python scripts/incremental-git-model.test.py
          python scripts/incremental-real-repo.test.py
          python scripts/incremental-chain-evidence.test.py
          python scripts/incremental-registry-evidence.test.py
          python scripts/incremental-publication-state.test.py
          python scripts/incremental-release-entry.test.py
          python -B scripts/incremental-release-baseline.test.py
          python -B scripts/incremental-release-checkpoint.test.py
          python -B scripts/incremental-release-materialize.test.py
          python scripts/incremental-release-publish.test.py
          python -B scripts/release-npm-tarball.test.py
          python scripts/incremental-release-record.test.py
          python scripts/incremental-release-functional.test.py
          python -B scripts/release-retry-safety.test.py
          node --test scripts/release-recovery-dag.test.mjs scripts/ci-provenance-template.test.mjs scripts/release-provenance-wiring.test.mjs
          node --test scripts/incremental-release-producer.test.mjs scripts/release-native-scope.test.mjs scripts/release-chain-boundaries.test.mjs
          node --test e2e/worker-finish.test.mjs e2e/worker-outcome.test.mjs
          python scripts/ci-execution-ledger.test.py
          python scripts/ci-execution-evidence.test.py
          python scripts/ci-suite-attempts.test.py
          python scripts/ci-suite-upload-outputs.test.py
          python scripts/ci-unit-shadow-inputs.test.py
          python scripts/ci-rerun-dag.test.py
          python scripts/ci-restore-depth.test.py
      - name: Check release source and failure paths without publishing
        run: >-
          node --test scripts/v2-*.test.mjs scripts/release-archive.test.mjs
          scripts/check-pr-changesets.test.mjs
          scripts/release-rust-metadata.test.mjs scripts/compose-v2-release-seal.test.mjs
          scripts/pack-v2-npm-candidates.test.mjs scripts/prepare-v2-candidate-js.test.mjs
          scripts/check-published-rust-closure.test.mjs scripts/prepare-sdk-frozen-lock.test.mjs scripts/sdk-candidate-registry.test.mjs
          scripts/verify-published-v2-consumers.test.mjs scripts/ci-native-capture.test.mjs scripts/create-farm-pack.test.mjs scripts/ci-suite-inventory.test.mjs
          scripts/ci-suite-execution.test.mjs scripts/ci-suite-rerun.test.mjs scripts/ci-suite-impact.test.mjs scripts/ci-suite-real-repo.test.mjs scripts/ci-examples-build-counts.test.mjs
      - id: shadow-upload
        name: Preserve actual cell receipt (shadow only)
        if: always()
        continue-on-error: true
        uses: ./.github/actions/ci-impact-cell
        with:
          cell: "contracts"
          status: ${{ job.status }}
          artifact-suffix: single

  docs-acceptance:
    if: always()
    name: Docs CI quality checks
    needs: [version-classification, primary-linux, primary-windows]
    runs-on: ubuntu-24.04
    steps:
      - name: Require both platform Docs chains
        env:
          LINUX_RESULT: ${{ needs.primary-linux.result }}
          WINDOWS_RESULT: ${{ needs.primary-windows.result }}
        run: test "$LINUX_RESULT" = success && test "$WINDOWS_RESULT" = success

  platform-contract-tests:
    if: always()
    needs: [version-classification, platform-contract-linux, platform-contract-macos, platform-contract-windows]
    name: Platform safety contracts
    runs-on: ubuntu-24.04
    steps:
      - name: Require all platform safety executions
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: python -c "import json,os; assert all(v['result']=='success' for v in json.loads(os.environ['RESULTS']).values())"

  platform-contract-linux:

    needs: [version-classification]
    uses: ./.github/workflows/ci-platform-safety.yaml
    with:
      os: ubuntu-24.04

  platform-contract-macos:

    needs: [version-classification]
    uses: ./.github/workflows/ci-platform-safety.yaml
    with:
      os: macos-latest

  platform-contract-windows:

    needs: [version-classification]
    uses: ./.github/workflows/ci-platform-safety.yaml
    with:
      os: windows-latest

  primary-linux:

    permissions:
      contents: read
      actions: read
    name: Primary Linux
    needs: [version-classification, release-contract-tests, platform-contract-tests, type-check]
    uses: ./.github/workflows/ci-primary-platform.yaml
    with:
      os: ubuntu-24.04
      abi: linux-x64-gnu
    secrets: inherit

  primary-macos:

    permissions:
      contents: read
      actions: read
    name: Primary macOS
    needs: [version-classification, release-contract-tests, platform-contract-tests, type-check]
    uses: ./.github/workflows/ci-primary-platform.yaml
    with:
      os: macos-latest
      abi: darwin-arm64
    secrets: inherit

  primary-windows:

    permissions:
      contents: read
      actions: read
    name: Primary Windows
    needs: [version-classification, release-contract-tests, platform-contract-tests, type-check]
    uses: ./.github/workflows/ci-primary-platform.yaml
    with:
      os: windows-latest
      abi: win32-x64-msvc
    secrets: inherit

  call-rust-build-user:
    name: All primary native and consumer chains
    if: (always())
    needs: [version-classification, primary-linux, primary-macos, primary-windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require all primary platform chains to succeed
        shell: bash
        env:
          LINUX_RESULT: ${{ needs.primary-linux.result }}
          MACOS_RESULT: ${{ needs.primary-macos.result }}
          WINDOWS_RESULT: ${{ needs.primary-windows.result }}
        run: test "$LINUX_RESULT" = success && test "$MACOS_RESULT" = success && test "$WINDOWS_RESULT" = success

  call-rust-build-release:
    permissions:
      contents: read
      actions: read

    needs: [version-classification, release-contract-tests, platform-contract-tests]
    uses: ./.github/workflows/ci-secondary-native.yaml
    secrets: inherit

  check-native-candidate-assembly:
    outputs:
      artifact_id: ${{ steps.shadow-upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.shadow-upload.outputs.artifact-digest }}
      run_attempt: ${{ steps.shadow-upload.outputs.run-attempt }}

    name: Check declared native inputs (not ABI execution)
    needs: [version-classification, call-rust-build-user, call-rust-build-release, type-check, primary-linux, primary-macos, primary-windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
      - uses: actions/download-artifact@v4
        with:
          pattern: ${{ github.sha }}-*
          path: .native-artifacts
      - name: Assemble the exact candidate manifest without rebuilding Rust
        run: node scripts/assemble-v2-native-artifacts.mjs .native-artifacts native-assembly.json
      - uses: actions/setup-python@v5
        continue-on-error: true
        with:
          python-version: '3.12'
      - name: Bind shadow producer identities using existing read-only access (no ZIP download)
        continue-on-error: true
        env:
          CI_NATIVE_UPLOADS: >-
            {"linux-x64-musl":${{ needs.call-rust-build-release.outputs.linux_x64_musl_product_upload }},"darwin-x64":${{ needs.call-rust-build-release.outputs.darwin_x64_product_upload }},"win32-ia32-msvc":${{ needs.call-rust-build-release.outputs.win32_ia32_msvc_product_upload }},"win32-arm64-msvc":${{ needs.call-rust-build-release.outputs.win32_arm64_msvc_product_upload }},"linux-arm64-musl":${{ needs.call-rust-build-release.outputs.linux_arm64_musl_product_upload }},"linux-arm64-gnu":${{ needs.call-rust-build-release.outputs.linux_arm64_gnu_product_upload }},"linux-x64-gnu":${{ needs.primary-linux.outputs.native_product_upload }},"darwin-arm64":${{ needs.primary-macos.outputs.native_product_upload }},"win32-x64-msvc":${{ needs.primary-windows.outputs.native_product_upload }}}
        run: python scripts/ci-native-evidence.py --audit-current-run --output native-shadow-identities.json
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: native-shadow-identities-${{ github.sha }}-${{ github.run_attempt }}
          path: native-shadow-identities.json
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: native-assembly-${{ github.sha }}
          path: native-assembly.json
          if-no-files-found: error
      - id: shadow-upload
        name: Preserve actual cell receipt (shadow only)
        if: always()
        continue-on-error: true
        uses: ./.github/actions/ci-impact-cell
        with:
          cell: "native-assembly"
          status: ${{ job.status }}
          artifact-suffix: single

  examples-test:
    name: All primary Examples chains
    if: (always())
    needs: [version-classification, primary-linux, primary-macos, primary-windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require all primary platform chains to succeed
        shell: bash
        env:
          LINUX_RESULT: ${{ needs.primary-linux.result }}
          MACOS_RESULT: ${{ needs.primary-macos.result }}
          WINDOWS_RESULT: ${{ needs.primary-windows.result }}
        run: test "$LINUX_RESULT" = success && test "$MACOS_RESULT" = success && test "$WINDOWS_RESULT" = success

  candidate-packages:
    name: Complete PR candidate package tests
    needs: [check-native-candidate-assembly, primary-linux, primary-macos, primary-windows, type-check]
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/v2-candidate-seal.yaml

  execution-baseline:
    outputs:
      execution_id: ${{ steps.execution-upload.outputs.artifact-id }}
      execution_digest: ${{ steps.execution-upload.outputs.artifact-digest }}
      execution_attempt: ${{ steps.execution-origin.outputs.attempt }}
      artifact_id: ${{ steps.shadow-upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.shadow-upload.outputs.artifact-digest }}
      run_attempt: ${{ steps.shadow-upload.outputs.run-attempt }}
    name: Record verified CI execution baseline
    needs: [version-classification, type-check, primary-linux, primary-macos, primary-windows]
    if: (always() && (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'))
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        if: success()
        with:
          node-version: 22.20.0
      - uses: actions/setup-python@v5
        if: success()
        with:
          python-version: '3.12'
      - name: Resolve original successful suite attempts without rebuilding
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          FARM_SUITE_UPLOADS_LINUX: ${{ toJSON(needs.primary-linux.outputs) }}
          FARM_SUITE_UPLOADS_MACOS: ${{ toJSON(needs.primary-macos.outputs) }}
          FARM_SUITE_UPLOADS_WINDOWS: ${{ toJSON(needs.primary-windows.outputs) }}
        run: python -B scripts/ci-suite-attempts.py --output ci-baseline-inputs/suites
      - name: Validate complete discovered and executed suite coverage
        if: success()
        run: node scripts/ci-suite-execution.mjs --collect ci-baseline-inputs/suites ci-execution-ledger/suite-coverage.json
      - name: Record candidate CI execution baseline (no build-byte authority)
        if: success()
        run: python scripts/ci-execution-ledger.py --coverage ci-execution-ledger/suite-coverage.json --output ci-execution-ledger/ledger.json
      - id: execution-origin
        if: success()
        run: echo "attempt=$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - id: execution-upload
        name: Upload trusted CI execution baseline
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: farm-ci-execution-baseline-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-execution-ledger/ledger.json
          if-no-files-found: error
          retention-days: 14
      - id: shadow-upload
        name: Preserve actual cell receipt (shadow only)
        if: always()
        continue-on-error: true
        uses: ./.github/actions/ci-impact-cell
        with:
          cell: "execution-baseline"
          status: ${{ job.status }}
          artifact-suffix: single

  type-check:
    needs: [version-classification]
    name: Type Check
    outputs:
      artifact_id: ${{ steps.shadow-upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.shadow-upload.outputs.artifact-digest }}
      run_attempt: ${{ steps.shadow-upload.outputs.run-attempt }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4

        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5

        with:
          python-version: '3.12'
      - name: Validate unified graph rules before baseline or cache lookup

        run: python -B scripts/unified-impact-graph.py --validate
      - name: Setup pnpm

        uses: pnpm/action-setup@v4
        with:
          version: 9.4.0
          run_install: false
      - uses: actions/setup-node@v4

        with:
          node-version: 20
      - name: Install Dependencies

        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 60
          max_attempts: 3
          retry_wait_seconds: 10
          command: pnpm i --frozen-lockfile
      - name: Build CLI and Core

        run: pnpm --filter @farmfe/cli run build
      - name: Build Runtime

        run: pnpm --filter @farmfe/runtime run build
      - name: Build Babel Plugin Types

        run: pnpm --filter @farmfe/js-plugin-babel exec tsc -p tsconfig.json --emitDeclarationOnly
      - name: Build Docs Public Types

        run: pnpm --filter @farmfe/docs run build
      - name: Type Check With Tsc

        run: pnpm run --filter "@farmfe/*" type-check
      - id: shadow-upload
        name: Preserve actual cell receipt (shadow only)
        if: always()
        continue-on-error: true
        uses: ./.github/actions/ci-impact-cell
        with:
          cell: "types"
          status: ${{ job.status }}
          artifact-suffix: single

  changesets-check:
    name: Changesets Check
    needs: [version-classification]
    if: needs.version-classification.outputs.mode != 'verified-version-only'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 9.4.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Changesets dependencies without running product builds
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Check Changesets policy independently
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check-pr-changesets.mjs

  ts-test:
    name: All primary TypeScript chains
    if: (always())
    needs: [version-classification, primary-linux, primary-macos, primary-windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require all primary platform chains to succeed
        shell: bash
        env:
          LINUX_RESULT: ${{ needs.primary-linux.result }}
          MACOS_RESULT: ${{ needs.primary-macos.result }}
          WINDOWS_RESULT: ${{ needs.primary-windows.result }}
        run: test "$LINUX_RESULT" = success && test "$MACOS_RESULT" = success && test "$WINDOWS_RESULT" = success

  incremental-execution-gate:
    permissions:
      contents: read
      actions: read
    name: Incremental CI execution gate
    if: always()
    needs: [version-classification, type-check, primary-linux, primary-macos, primary-windows, call-rust-build-release, check-native-candidate-assembly, examples-test, ts-test, candidate-packages]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Require every planned platform and current test chain to finish successfully
        shell: python
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          import json, os
          rows=json.loads(os.environ['RESULTS'])
          expected={'version-classification','type-check','primary-linux','primary-macos','primary-windows','call-rust-build-release','check-native-candidate-assembly','examples-test','ts-test','candidate-packages'}
          assert set(rows)==expected, 'Missing or unexpected DAG dependency'
          if set(rows)!=expected or any(row['result']!='success' for row in rows.values()):
              raise ValueError('Missing, skipped, cancelled or failed actual CI execution')
      - uses: actions/checkout@v4

        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5

        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4

        with:
          node-version: 22.20.0
      - name: Resolve original successful suite attempts without rebuilding

        env:
          GH_TOKEN: ${{ github.token }}
          FARM_SUITE_UPLOADS_LINUX: ${{ toJSON(needs.primary-linux.outputs) }}
          FARM_SUITE_UPLOADS_MACOS: ${{ toJSON(needs.primary-macos.outputs) }}
          FARM_SUITE_UPLOADS_WINDOWS: ${{ toJSON(needs.primary-windows.outputs) }}
        run: python -B scripts/ci-suite-attempts.py --output ci-gate-suites
      - name: Validate actual selected suite files and case counts on every platform

        run: node scripts/ci-suite-execution.mjs --collect ci-gate-suites ci-gate-coverage/coverage.json
