name: Recommend fixed-main release recovery
on:
  workflow_run:
    workflows: [E2E Tests, Unit Tests, Independent incremental release planning and verification]
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: farm-release-evidence-recovery-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false
jobs:
  recover:
    if: github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.id == github.event.repository.id
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    steps:
      # Only trusted main control code, never the triggering PR/source checkout.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Recommend recovery only for a proven unfrozen pending release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -B scripts/release-evidence-recovery.py
