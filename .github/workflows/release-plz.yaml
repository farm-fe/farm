# Name of the workflow: you can change it.
name: Release-plz

# Cargo version-PR preparation only. Stable publication uses the sealed V2 DAG.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      operation:
        description: Prepare a reviewed Cargo version PR; this workflow cannot publish
        required: true
        type: choice
        default: release-pr
        options:
          - release-pr

concurrency:
  group: farm-cargo-version-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Publication is owned by the exact sealed V2 DAG, never workspace-wide release-plz.
  # Create a PR with the new versions and changelog, preparing the next release.
  # If you want release-plz to only release your packages
  # and you want to update `Cargo.toml` versions and changelogs by yourself,
  # remove this job.
  release-plz-pr:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.operation == 'release-pr')
    name: Release-plz PR
    runs-on: ubuntu-latest
    permissions:
      # Used to create and update pull requests.
      pull-requests: write
      # Used to push to the pull request branch.
      contents: write

    # The concurrency block is explained below (after the code block).
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # `fetch-depth: 0` is needed to clone all the git history, which is necessary to
          # determine the next version and build the changelog.
          fetch-depth: 0
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-04-10
          components: clippy, rustfmt
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
      - name: Run release-plz
        id: release-plz
        uses: release-plz/action@v0.5
        with:
          # Run `release-plz release-pr` command.
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Public registry version preparation requires no publication credential.
      - name: Bind the exact proposal to this producer run
        id: cargo-production
        # The action emits pr='{}', prs_created='false' for a valid no-op.
        # Validate both outputs even then, so malformed data cannot be ignored.
        if: steps.release-plz.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          FARM_CARGO_ACTION_PR: ${{ steps.release-plz.outputs.pr }}
          FARM_CARGO_PRS_CREATED: ${{ steps.release-plz.outputs.prs_created }}
        run: node scripts/prepare-cargo-version-proposal.mjs --record-production
      - name: Preserve immutable proposal receipt
        if: steps.cargo-production.outputs.has_proposal == 'true'
        id: cargo-artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.cargo-production.outputs.artifact_name }}
          path: .release-cargo-producer/receipt.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
      - name: Index the immutable receipt on its proposal
        if: steps.cargo-production.outputs.has_proposal == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          FARM_CARGO_ARTIFACT_ID: ${{ steps.cargo-artifact.outputs.artifact-id }}
          FARM_CARGO_ARTIFACT_DIGEST: ${{ steps.cargo-artifact.outputs.artifact-digest }}
        run: node scripts/prepare-cargo-version-proposal.mjs --index-production
