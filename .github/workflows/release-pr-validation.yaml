name: Non-publishable PR release-profile validation
on:
  workflow_call:
permissions:
  contents: read
  actions: read
jobs:
  native-primary:
    uses: ./.github/workflows/rust-build-user.yaml
    with:
      profile: release
  native-extra:
    uses: ./.github/workflows/rust-build-release.yaml
    with:
      profile: release
  seal:
    needs: [native-primary, native-extra]
    name: Seal non-publishable PR release-profile reference
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      FARM_BUILD_PROFILE: release
      CARGO_BUILD_JOBS: 1
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
      # Legal blockers fail before installs, JS work or the SDK compilation.
      - name: Audit all selected source license declarations and original text
        run: node scripts/audit-v2-source-licenses.mjs
      - uses: pnpm/action-setup@v4
        id: pnpm-setup
        with:
          version: 9.4.0
          run_install: false
      - run: pnpm install --frozen-lockfile
      - run: node scripts/release-pr-validation.mjs scope
      - run: mkdir .release-work
      - uses: actions/download-artifact@v4
        with:
          pattern: ${{ github.sha }}-*
          path: .native-artifacts
      - uses: actions/download-artifact@v4
        with:
          pattern: native-shadow-${{ github.sha }}-*-${{ github.run_attempt }}
          path: .release-native-proof
      - name: Assemble all current-run native outputs and build JS only
        env:
          FARM_PNPM_CLI: ${{ steps.pnpm-setup.outputs.dest }}/node_modules/pnpm/bin/pnpm.cjs
        run: pnpm exec node scripts/prepare-v2-candidate-js.mjs .native-artifacts .release-work/native-assembly.json
      - name: Read current-run artifact identities without downloading another run
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --paginate --slurp repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts?per_page=100 > .release-work/artifact-index.json
      - name: Normally pack and verify all 297 selected npm candidates
        env:
          FARM_PNPM_CLI: ${{ steps.pnpm-setup.outputs.dest }}/node_modules/pnpm/bin/pnpm.cjs
        run: node scripts/release-pr-validation.mjs pack .release-work/native-assembly.json .release-work/artifact-index.json .release-work/npm
      - name: Install the pinned SDK validation toolchain
        run: rustup toolchain install nightly-2026-04-10 --profile minimal
      - name: Fetch locked public dependencies, without compiling native products
        run: |
          cargo +nightly-2026-04-10 fetch --locked
          node scripts/prepare-sdk-frozen-lock.mjs fetch-recipe .release-work/public-fetch
          cargo +nightly-2026-04-10 fetch --manifest-path .release-work/public-fetch/Cargo.toml
      - name: Package selected Cargo SDK candidates without publishing or native rebuilding
        run: node scripts/seal-v2-rust-packages.mjs .release-work/rust
      - name: Materialize verified isolated registry and bind only candidate checksums
        run: |
          node scripts/sdk-candidate-registry.mjs .release-work/rust .release-work/sdk
          node scripts/prepare-sdk-frozen-lock.mjs bind-candidate .release-work/sdk
          node -e "require('node:fs').appendFileSync(process.env.GITHUB_ENV,'FARM_SDK_WINDOW_END='+new Date(Date.now()+90*60*1000).toISOString()+'\n')"
      - name: Independently consume the exact packaged SDK, with no workspace patches
        env:
          FARM_SDK_FROZEN_LOCK: '1'
        run: node scripts/run-sdk-consumer.mjs .release-work/sdk
      - name: Seal portable SDK evidence and compose the complete candidate
        run: |
          node scripts/seal-sdk-consumer.mjs .release-work/sdk/sdk-consumer.json .release-work/sdk-portable
          node scripts/compose-v2-release-seal.mjs .release-work/npm .release-work/sdk-portable release-candidate
          node scripts/release-pr-validation.mjs seal release-candidate
      - uses: actions/upload-artifact@v4
        with:
          name: release-pr-validation-${{ github.sha }}-${{ github.run_attempt }}
          path: release-candidate/
          if-no-files-found: error
          retention-days: 90
      - name: Collect bounded generated diagnostics without environment or workspace uploads
        if: failure()
        run: node scripts/v2-release-diagnostics.mjs .release-work
      - name: Preserve incomplete diagnostics without calling them a seal
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-pr-validation-diagnostics-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            release-diagnostics/js-build-failure.json
            release-diagnostics/seal-failure.json
          if-no-files-found: warn

  consumers:
    name: PR release-profile candidate consumer (${{ matrix.os }})
    needs: [seal]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      FARM_BUILD_PROFILE: release
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
      - name: Download only the current producer sealed candidate
        uses: actions/download-artifact@v4
        with:
          name: release-pr-validation-${{ github.sha }}-${{ github.run_attempt }}
          path: release-candidate
      - name: Verify exact non-publishable current-run binding
        run: node scripts/release-pr-validation.mjs verify release-candidate
      - name: Independently install exact candidates and execute only the host native ABI
        run: node scripts/verify-v2-npm-consumer.mjs release-candidate candidate-consumer-results
      - name: Preserve independent consumer result and bounded stage logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-pr-validation-consumer-${{ github.sha }}-${{ matrix.os }}-${{ github.run_attempt }}
          path: |
            candidate-consumer-results/result.json
            candidate-consumer-results/runtime-proof.json
            candidate-consumer-results/package-lock.json
            candidate-consumer-results/*.log
          if-no-files-found: warn
          retention-days: 30
