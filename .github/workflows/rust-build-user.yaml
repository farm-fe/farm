name: Build User Rust Artifacts
on:
  workflow_call:
    inputs:
      native_owners:
        required: false
        type: string
        default: ''
      profile:
        required: false
        type: string
        default: ci
      platform:
        required: false
        type: string
        default: all

permissions:
  contents: read

concurrency:
  group: rust-build-user-${{ github.workflow }}-${{ github.ref }}-${{ inputs.platform }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and Upload User Artifacts - ${{ matrix.settings.abi }}
    runs-on: ${{ matrix.settings.os }}
    env:
      FARM_NATIVE_PROOF_MODE: shadow
      FARM_RELEASE_NATIVE_OWNERS: ${{ inputs.native_owners }}
    strategy:
      fail-fast: false
      matrix:
        settings: ${{ fromJSON(inputs.platform == 'all' && '[{"os":"ubuntu-24.04","docker":"ghcr.io/napi-rs/napi-rs/nodejs-rust:lts-debian","abi":"linux-x64-gnu","target":"x86_64-unknown-linux-gnu"},{"os":"macos-latest","abi":"darwin-arm64","target":"aarch64-apple-darwin"},{"os":"windows-latest","abi":"win32-x64-msvc","target":"x86_64-pc-windows-msvc"}]' || inputs.platform == 'linux-x64-gnu' && '[{"os":"ubuntu-24.04","docker":"ghcr.io/napi-rs/napi-rs/nodejs-rust:lts-debian","abi":"linux-x64-gnu","target":"x86_64-unknown-linux-gnu"}]' || inputs.platform == 'darwin-arm64' && '[{"os":"macos-latest","abi":"darwin-arm64","target":"aarch64-apple-darwin"}]' || inputs.platform == 'win32-x64-msvc' && '[{"os":"windows-latest","abi":"win32-x64-msvc","target":"x86_64-pc-windows-msvc"}]' || '[]') }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve the host Cargo cache for Docker mounts
        shell: bash
        run: |
          node --input-type=commonjs <<'NODE'
          const fs = require('node:fs'), path = require('node:path'), os = require('node:os');
          const home = path.join(os.homedir(), '.cargo');
          if (/[\r\n]/.test(home)) throw Error('Cargo source home must be a single line');
          for (const member of ['git', 'registry']) fs.mkdirSync(path.join(home, member), {recursive: true});
          fs.appendFileSync(process.env.GITHUB_ENV, `FARM_CARGO_HOME=${home}\n`);
          NODE
      - name: Restore small dependency sources for a primary writer
        uses: ./.github/actions/cargo-source-cache
        with:
          writer: 'true'
      - name: Capture locked cleanup metadata once before native compilation
        timeout-minutes: 10
        env:
          FARM_CARGO_METADATA: ${{ runner.temp }}/farm-cargo-metadata.json
        run: node scripts/cargo-cache-command.cjs --snapshot
      - name: Identify the native target cache environment
        timeout-minutes: 10
        shell: bash
        env:
          FARM_IMAGE: ${{ matrix.settings.docker || '' }}
        run: |
          set -eu
          if [ -n "$FARM_IMAGE" ]; then
            docker pull "$FARM_IMAGE"
            context="$(docker image inspect --format '{{.Id}}' "$FARM_IMAGE")"
          else
            context="${ImageOS:?}-${ImageVersion:?}"
          fi
          if [[ ! "$context" =~ ^[A-Za-z0-9_.:-]+$ ]]; then
            echo 'Invalid native cache environment identity' >&2
            exit 64
          fi
          printf 'FARM_NATIVE_CACHE_CONTEXT=%s\n' "$context" >> "$GITHUB_ENV"
      - name: Cache isolated native target dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2, reviewed metadata and cleanup contract
        env:
          # This action-only home is empty: source archives have a separate owner.
          # Actual builds continue using FARM_CARGO_HOME / the default Cargo home.
          CARGO_HOME: ${{ runner.temp }}/farm-target-cache-home
          FARM_CARGO_METADATA: ${{ runner.temp }}/farm-cargo-metadata.json
        with:
          workspaces: ". -> target"
          cache-on-failure: false
          cache-bin: false
          cmd-format: node scripts/cargo-cache-command.cjs {0}
          env-vars: FARM_NATIVE_CACHE_CONTEXT
          # These three primary producers remain writers on the active release PR.
          save-if: true
          prefix-key: rust-target-v1-${{ inputs.profile }}-${{ matrix.settings.abi }}
          shared-key: rust-build-${{ matrix.settings.abi }}
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.4.0
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
      - name: Install Dependencies
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 60
          command: pnpm i --frozen-lockfile

      - name: Build Plugin Tools
        run: pnpm --filter @farmfe/plugin-tools run build
      - name: Verify new glob dependency closure
        if: matrix.settings.abi == 'linux-x64-gnu'
        shell: bash
        run: |
          cargo metadata --locked --all-features --format-version 1 > "$RUNNER_TEMP/farm-glob-metadata.json"
          node scripts/assert-glob-dependency-closure.mjs "$RUNNER_TEMP/farm-glob-metadata.json"
          node --test scripts/assert-glob-dependency-closure.test.mjs
      - name: Verify native artifact build and release flow
        if: matrix.settings.abi == 'linux-x64-gnu'
        run: |
          node scripts/test-native-container-node.cjs
          node scripts/test-native-artifact-flow.cjs
      - run: rustup target add ${{ matrix.settings.target }}
        if: ${{ matrix.settings.target }}
      - uses: mlugg/setup-zig@v2
        if: ${{ matrix.settings.zig }}
        with:
          version: 0.13.0
      - name: Free Disk Space (Ubuntu)
        if: ${{ matrix.settings.docker }}
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false
          swap-storage: true
      - name: Build in Docker with host-owned Cargo cache export
        if: ${{ matrix.settings.docker }}
        run: node scripts/v2-docker-cargo-cache.mjs
        env:
          FARM_BUILD_IMAGE: ${{ matrix.settings.docker }}
          FARM_BUILD_PROFILE: ${{ inputs.profile }}
          FARM_BUILD_ABI: ${{ matrix.settings.abi }}
          FARM_BUILD_TARGET: ${{ matrix.settings.target || '' }}
          FARM_BUILD_ZIG: ${{ matrix.settings.zig || false }}
      - name: Preserve owned-container cache readability and build exit evidence
        if: ${{ always() && matrix.settings.docker }}
        uses: actions/upload-artifact@v4
        with:
          name: cargo-cache-${{ github.sha }}-${{ matrix.settings.abi }}-${{ github.run_attempt }}
          include-hidden-files: true
          path: .ci-native-cache/${{ matrix.settings.abi }}.json
          if-no-files-found: warn
          retention-days: 14
      - name: Build
        if: ${{ !matrix.settings.docker }}
        run: ./scripts/ci-build-rust-artifacts.sh
        shell: bash
        env:
          FARM_BUILD_PROFILE: ${{ inputs.profile }}
          FARM_BUILD_ABI: ${{ matrix.settings.abi }}
          FARM_BUILD_TARGET: ${{ matrix.settings.target || '' }}
          FARM_BUILD_ZIG: ${{ matrix.settings.zig || false }}
      - name: Verify cleanup metadata remains valid before cache post-save
        env:
          FARM_CARGO_METADATA: ${{ runner.temp }}/farm-cargo-metadata.json
        run: node scripts/cargo-cache-command.cjs --verify-snapshot
      - uses: actions/setup-python@v5
        if: inputs.profile == 'ci' && matrix.settings.abi == 'linux-x64-gnu' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          python-version: '3.13'
      - name: Seal actual main CI native bytes with measured GNU context
        id: ci-byte-bundle
        continue-on-error: true
        if: inputs.profile == 'ci' && matrix.settings.abi == 'linux-x64-gnu' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          FARM_BUILD_ABI: ${{ matrix.settings.abi }}
          FARM_BUILD_PROFILE: ${{ inputs.profile }}
          FARM_BUILD_TARGET: ${{ matrix.settings.target }}
        run: |
          node scripts/ci-native-capture.mjs products
          python -B scripts/ci-leaf-native.py produce --products .ci-native-proof/linux-x64-gnu/products.json --output ci-native-byte-bundle
      - name: Upload trusted CI native byte bundle
        if: inputs.profile == 'ci' && matrix.settings.abi == 'linux-x64-gnu' && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.ci-byte-bundle.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: farm-ci-byte-bundle-${{ github.sha }}-linux-x64-gnu-${{ github.run_attempt }}
          path: ci-native-byte-bundle/
          if-no-files-found: error
          retention-days: 3
      - name: Upload Core
        if: ${{ inputs.profile != 'release' || inputs.native_owners == '' || contains(fromJSON(inputs.native_owners), '@farmfe/core') }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.sha }}-${{ matrix.settings.abi }}
          path: ./packages/core/binding/farm.${{ matrix.settings.abi }}.node
          if-no-files-found: error
      - name: Upload Create Farm Rust
        if: ${{ inputs.profile != 'release' || inputs.native_owners == '' || contains(fromJSON(inputs.native_owners), 'create-farm') }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.sha }}-${{ matrix.settings.abi }}-create-farm
          path: ./packages/create-farm/create-farm.${{ matrix.settings.abi }}.node
          if-no-files-found: error
      - name: Upload Plugin React
        if: ${{ inputs.profile != 'release' || inputs.native_owners == '' || contains(fromJSON(inputs.native_owners), '@farmfe/plugin-react') }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.sha }}-${{ matrix.settings.abi }}-plugin-react
          path: rust-plugins/react/npm/${{ matrix.settings.abi }}/index.farm
          if-no-files-found: error
      - name: Upload Plugin Replace Dirname
        if: ${{ inputs.profile != 'release' || inputs.native_owners == '' || contains(fromJSON(inputs.native_owners), '@farmfe/plugin-replace-dirname') }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.sha }}-${{ matrix.settings.abi }}-plugin-replace-dirname
          path: rust-plugins/replace-dirname/npm/${{ matrix.settings.abi }}/index.farm
          if-no-files-found: error
      - name: Upload Plugin Sass
        if: ${{ inputs.profile != 'release' || inputs.native_owners == '' || contains(fromJSON(inputs.native_owners), '@farmfe/plugin-sass') }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.sha }}-${{ matrix.settings.abi }}-plugin-sass
          path: rust-plugins/sass/npm/${{ matrix.settings.abi }}/index.farm
          if-no-files-found: error
      - name: Upload Plugin Vue
        if: ${{ inputs.profile != 'release' || inputs.native_owners == '' || contains(fromJSON(inputs.native_owners), '@farmfe/plugin-vue') }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.sha }}-${{ matrix.settings.abi }}-plugin-vue
          path: rust-plugins/vue/npm/${{ matrix.settings.abi }}/index.farm
          if-no-files-found: error
      - name: Upload Plugin Vue JSX
        if: ${{ inputs.profile != 'release' || inputs.native_owners == '' || contains(fromJSON(inputs.native_owners), '@farmfe/plugin-vue-jsx') }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.sha }}-${{ matrix.settings.abi }}-plugin-vue-jsx
          path: rust-plugins/vue-jsx/npm/${{ matrix.settings.abi }}/index.farm
          if-no-files-found: error
      - name: Upload Plugin Auto Import
        if: ${{ inputs.profile != 'release' || inputs.native_owners == '' || contains(fromJSON(inputs.native_owners), '@farmfe/plugin-auto-import') }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.sha }}-${{ matrix.settings.abi }}-plugin-auto-import
          path: rust-plugins/auto-import/npm/${{ matrix.settings.abi }}/index.farm
          if-no-files-found: error
      - name: Upload Plugin Compress
        if: ${{ inputs.profile != 'release' || inputs.native_owners == '' || contains(fromJSON(inputs.native_owners), '@farmfe/plugin-compress') }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.sha }}-${{ matrix.settings.abi }}-plugin-compress
          path: rust-plugins/compress/npm/${{ matrix.settings.abi }}/index.farm
          if-no-files-found: error
      - name: Upload Plugin Dsv
        if: ${{ inputs.profile != 'release' || inputs.native_owners == '' || contains(fromJSON(inputs.native_owners), '@farmfe/plugin-dsv') }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.sha }}-${{ matrix.settings.abi }}-plugin-dsv
          path: rust-plugins/dsv/npm/${{ matrix.settings.abi }}/index.farm
          if-no-files-found: error
      - name: Upload Plugin Dts
        if: ${{ inputs.profile != 'release' || inputs.native_owners == '' || contains(fromJSON(inputs.native_owners), '@farmfe/plugin-dts') }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.sha }}-${{ matrix.settings.abi }}-plugin-dts
          path: rust-plugins/dts/npm/${{ matrix.settings.abi }}/index.farm
          if-no-files-found: error
      - name: Upload Plugin Icons
        if: ${{ inputs.profile != 'release' || inputs.native_owners == '' || contains(fromJSON(inputs.native_owners), '@farmfe/plugin-icons') }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.sha }}-${{ matrix.settings.abi }}-plugin-icons
          path: rust-plugins/icons/npm/${{ matrix.settings.abi }}/index.farm
          if-no-files-found: error
      - name: Upload Plugin Image
        if: ${{ inputs.profile != 'release' || inputs.native_owners == '' || contains(fromJSON(inputs.native_owners), '@farmfe/plugin-image') }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.sha }}-${{ matrix.settings.abi }}-plugin-image
          path: rust-plugins/image/npm/${{ matrix.settings.abi }}/index.farm
          if-no-files-found: error
      - name: Upload Plugin Mdx
        if: ${{ inputs.profile != 'release' || inputs.native_owners == '' || contains(fromJSON(inputs.native_owners), '@farmfe/plugin-mdx') }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.sha }}-${{ matrix.settings.abi }}-plugin-mdx
          path: rust-plugins/mdx/npm/${{ matrix.settings.abi }}/index.farm
          if-no-files-found: error
      - name: Upload Plugin Modular Import
        if: ${{ inputs.profile != 'release' || inputs.native_owners == '' || contains(fromJSON(inputs.native_owners), '@farmfe/plugin-modular-import') }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.sha }}-${{ matrix.settings.abi }}-plugin-modular-import
          path: rust-plugins/modular-import/npm/${{ matrix.settings.abi }}/index.farm
          if-no-files-found: error
      - name: Upload Plugin React Components
        if: ${{ inputs.profile != 'release' || inputs.native_owners == '' || contains(fromJSON(inputs.native_owners), '@farmfe/plugin-react-components') }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.sha }}-${{ matrix.settings.abi }}-plugin-react-components
          path: rust-plugins/react-components/npm/${{ matrix.settings.abi }}/index.farm
          if-no-files-found: error
      - name: Upload Plugin Strip
        if: ${{ inputs.profile != 'release' || inputs.native_owners == '' || contains(fromJSON(inputs.native_owners), '@farmfe/plugin-strip') }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.sha }}-${{ matrix.settings.abi }}-plugin-strip
          path: rust-plugins/strip/npm/${{ matrix.settings.abi }}/index.farm
          if-no-files-found: error
      - name: Upload Plugin Svgr
        if: ${{ inputs.profile != 'release' || inputs.native_owners == '' || contains(fromJSON(inputs.native_owners), '@farmfe/plugin-svgr') }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.sha }}-${{ matrix.settings.abi }}-plugin-svgr
          path: rust-plugins/svgr/npm/${{ matrix.settings.abi }}/index.farm
          if-no-files-found: error
      - name: Upload Plugin Url
        if: ${{ inputs.profile != 'release' || inputs.native_owners == '' || contains(fromJSON(inputs.native_owners), '@farmfe/plugin-url') }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.sha }}-${{ matrix.settings.abi }}-plugin-url
          path: rust-plugins/url/npm/${{ matrix.settings.abi }}/index.farm
          if-no-files-found: error
      - name: Upload Plugin Virtual
        if: ${{ inputs.profile != 'release' || inputs.native_owners == '' || contains(fromJSON(inputs.native_owners), '@farmfe/plugin-virtual') }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.sha }}-${{ matrix.settings.abi }}-plugin-virtual
          path: rust-plugins/virtual/npm/${{ matrix.settings.abi }}/index.farm
          if-no-files-found: error
      - name: Upload Plugin Wasm
        if: ${{ inputs.profile != 'release' || inputs.native_owners == '' || contains(fromJSON(inputs.native_owners), '@farmfe/plugin-wasm') }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.sha }}-${{ matrix.settings.abi }}-plugin-wasm
          path: rust-plugins/wasm/npm/${{ matrix.settings.abi }}/index.farm
          if-no-files-found: error
      - name: Upload Plugin Worker
        if: ${{ inputs.profile != 'release' || inputs.native_owners == '' || contains(fromJSON(inputs.native_owners), '@farmfe/plugin-worker') }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.sha }}-${{ matrix.settings.abi }}-plugin-worker
          path: rust-plugins/worker/npm/${{ matrix.settings.abi }}/index.farm
          if-no-files-found: error
      - name: Upload Plugin Yaml
        if: ${{ inputs.profile != 'release' || inputs.native_owners == '' || contains(fromJSON(inputs.native_owners), '@farmfe/plugin-yaml') }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.sha }}-${{ matrix.settings.abi }}-plugin-yaml
          path: rust-plugins/yaml/npm/${{ matrix.settings.abi }}/index.farm
          if-no-files-found: error
      - name: Upload Plugin TailwindCSS
        if: ${{ inputs.profile != 'release' || inputs.native_owners == '' || contains(fromJSON(inputs.native_owners), '@farmfe/plugin-tailwindcss') }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.sha }}-${{ matrix.settings.abi }}-plugin-tailwindcss
          path: rust-plugins/tailwindcss/npm/${{ matrix.settings.abi }}/index.farm
          if-no-files-found: error
      - name: Upload Plugin ssr-css
        if: ${{ (contains(fromJSON('["win32-x64-msvc","linux-x64-gnu","linux-arm64-gnu","darwin-x64","darwin-arm64"]'), matrix.settings.abi)) && (inputs.profile != 'release' || inputs.native_owners == '' || contains(fromJSON(inputs.native_owners), '@farmfe/plugin-ssr-css')) }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.sha }}-${{ matrix.settings.abi }}-plugin-ssr-css
          path: rust-plugins/ssr-css/npm/${{ matrix.settings.abi }}/index.farm
          if-no-files-found: error
      - name: Upload Plugin syntax-highlight
        if: ${{ (contains(fromJSON('["win32-x64-msvc","linux-x64-gnu","linux-arm64-gnu","darwin-x64","darwin-arm64"]'), matrix.settings.abi)) && (inputs.profile != 'release' || inputs.native_owners == '' || contains(fromJSON(inputs.native_owners), '@farmfe/plugin-syntax-highlight')) }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.sha }}-${{ matrix.settings.abi }}-plugin-syntax-highlight
          path: rust-plugins/syntax-highlight/npm/${{ matrix.settings.abi }}/index.farm
          if-no-files-found: error
      - name: Upload Plugin docs
        if: ${{ (contains(fromJSON('["win32-x64-msvc","linux-x64-gnu","linux-arm64-gnu","darwin-x64","darwin-arm64"]'), matrix.settings.abi)) && (inputs.profile != 'release' || inputs.native_owners == '' || contains(fromJSON(inputs.native_owners), '@farmfe/plugin-docs')) }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.sha }}-${{ matrix.settings.abi }}-plugin-docs
          path: rust-plugins/docs/npm/${{ matrix.settings.abi }}/index.farm
          if-no-files-found: error
      - name: Upload Plugin docs-snapshot
        if: ${{ (contains(fromJSON('["win32-x64-msvc","linux-x64-gnu","linux-arm64-gnu","darwin-x64","darwin-arm64"]'), matrix.settings.abi)) && (inputs.profile != 'release' || inputs.native_owners == '' || contains(fromJSON(inputs.native_owners), '@farmfe/plugin-docs-snapshot')) }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.sha }}-${{ matrix.settings.abi }}-plugin-docs-snapshot
          path: rust-plugins/docs-snapshot/npm/${{ matrix.settings.abi }}/index.farm
          if-no-files-found: error
      - name: Upload Plugin docs-seo
        if: ${{ (contains(fromJSON('["win32-x64-msvc","linux-x64-gnu","linux-arm64-gnu","darwin-x64","darwin-arm64"]'), matrix.settings.abi)) && (inputs.profile != 'release' || inputs.native_owners == '' || contains(fromJSON(inputs.native_owners), '@farmfe/plugin-docs-seo')) }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.sha }}-${{ matrix.settings.abi }}-plugin-docs-seo
          path: rust-plugins/docs-seo/npm/${{ matrix.settings.abi }}/index.farm
          if-no-files-found: error
      - name: Upload Plugin docs-snippets
        if: ${{ (contains(fromJSON('["win32-x64-msvc","linux-x64-gnu","linux-arm64-gnu","darwin-x64","darwin-arm64"]'), matrix.settings.abi)) && (inputs.profile != 'release' || inputs.native_owners == '' || contains(fromJSON(inputs.native_owners), '@farmfe/plugin-docs-snippets')) }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.sha }}-${{ matrix.settings.abi }}-plugin-docs-snippets
          path: rust-plugins/docs-snippets/npm/${{ matrix.settings.abi }}/index.farm
          if-no-files-found: error
      - uses: actions/setup-python@v5
        continue-on-error: true
        with:
          python-version: '3.12'
      - name: Capture successful producer bytes and committed input ledger (shadow only)
        continue-on-error: true
        env:
          FARM_BUILD_ABI: ${{ matrix.settings.abi }}
          FARM_BUILD_PROFILE: ${{ inputs.profile }}
          FARM_BUILD_TARGET: ${{ matrix.settings.target }}
        run: |
          node scripts/ci-native-capture.mjs products
          python scripts/ci-native-evidence.py --products .ci-native-proof/${{ matrix.settings.abi }}/products.json --output .ci-native-proof/${{ matrix.settings.abi }}/source.json
      - name: Preserve bounded shadow producer context without duplicating native archives
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: native-shadow-${{ github.sha }}-${{ matrix.settings.abi }}-${{ github.run_attempt }}
          include-hidden-files: true
          path: .ci-native-proof/${{ matrix.settings.abi }}/*.json
          if-no-files-found: warn
          retention-days: 14
      - name: Preserve actual cell receipt (shadow only)
        if: always()
        continue-on-error: true
        uses: ./.github/actions/ci-impact-cell
        with:
          cell: "native:${{ inputs.profile }}:${{ matrix.settings.abi }}"
          status: ${{ job.status }}
          artifact-suffix: ${{ matrix.settings.abi || matrix.os || 'single' }}
