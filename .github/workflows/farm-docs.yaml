name: Farm Docs

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'crates/**'
      - 'rust-ecosystem/**'
      - 'rust-plugins/**'
      - 'packages/**'
      - 'website/**'
      - 'examples/docs-*/**'
      - 'scripts/farm-docs-*'
      - 'scripts/v2-normal-pack-contract.mjs'
      - 'docs/farm-docs/consumer-fixtures/**'
      - 'Cargo.*'
      - 'rust-toolchain.toml'
      - '.cargo/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - 'tsconfig.base.json'
      - '.github/workflows/farm-docs.yaml'

permissions:
  contents: read

concurrency:
  group: farm-docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: Docs / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    env:
      CARGO_BUILD_JOBS: '2'
      CODEX_DOCS_EVIDENCE_PHASE: p10
      CODEX_DOCS_EVIDENCE_ATTEMPT: ci
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.4.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: farm-docs-${{ matrix.os }}
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Check platform manifest preparation without native compilation
        run: node --experimental-strip-types --test scripts/farm-docs-platform-preparation.test.mjs
      - name: Check distribution contracts and fixture chain without native compilation
        run: node --test scripts/farm-docs-package-contract.test.mjs scripts/farm-docs-consumer-isolation.test.mjs scripts/farm-docs-local-registry.test.mjs scripts/farm-docs-distribution-chain.test.mjs scripts/farm-docs-target-closure.test.mjs
      - name: Check npm archive extraction and provenance receipts without product builds
        run: python scripts/farm-docs-extract-package.test.py
      - name: Build shared JS prerequisites and plugin tools
        run: |
          for package in utils runtime runtime-plugin-hmr runtime-plugin-import-meta plugin-tools; do
            pnpm --dir "packages/$package" run build
          done
      - name: Build current Core native binding
        run: pnpm --dir packages/core run build:rs
      - name: Build Docs native plugin closure
        run: |
          for plugin in replace-dirname react mdx ssr-css syntax-highlight sass tailwindcss docs docs-snapshot docs-seo docs-snippets; do
            pnpm --dir "rust-plugins/$plugin" run build
          done
      - name: Build public JS packages
        run: |
          for package in core cli docs docs-theme-default; do
            pnpm --dir "packages/$package" run build
          done
      - name: Check CLI native error diagnostics
        run: node --test scripts/farm-docs-cli-diagnostics.test.mjs
      - name: Check native content, blog planning and development invalidation
        run: |
          cargo test -p farmfe_docs_content --lib -j 1
          cargo test -p farmfe_docs_content --test content -j 1
          cargo test -p farmfe_docs_content --test admonition_labels -j 1
          cargo test -p farmfe_docs_config --test config -j 1
          cargo test -p farmfe_docs_plan --test admonition_labels -j 1
          cargo test -p farmfe_docs_plan --test blog_views -j 1
          cargo test -p farmfe_plugin_docs --lib -j 1
      - name: Record actual native loader paths and guard subsequent checks
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import crypto from 'node:crypto';
          import {createRequire} from 'node:module';
          import {pathToFileURL} from 'node:url';
          const require=createRequire(path.join(process.cwd(),'package.json'));
          const binaries=[];
          const record=(name,file)=>({name,path:fs.realpathSync(file),sha256:crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex').toUpperCase()});
          binaries.push(record('core',require('./packages/core/binding/resolve-binding.cjs')));
          for(const name of ['replace-dirname','react','mdx','ssr-css','syntax-highlight','sass','tailwindcss','docs','docs-snapshot','docs-seo','docs-snippets']){
            const module=await import(pathToFileURL(path.resolve(`rust-plugins/${name}/scripts/index.js`)).href);
            binaries.push(record(name,module.default));
          }
          const directory=path.join(process.env.RUNNER_TEMP,'farm-docs-native');
          fs.mkdirSync(directory,{recursive:true});
          const baseline=path.join(directory,'baseline.json');
          fs.writeFileSync(baseline,JSON.stringify({sha:process.env.GITHUB_SHA,platform:process.platform,arch:process.arch,binaries},null,2),{flag:'wx'});
          fs.appendFileSync(process.env.GITHUB_ENV,`CODEX_DOCS_NATIVE_BASELINE=${baseline}
          CODEX_DOCS_NATIVE_GUARD_DIR=${path.join(directory,'guards')}
          NODE_OPTIONS=${process.env.NODE_OPTIONS ?? ''} --import=${pathToFileURL(path.resolve('scripts/farm-docs-native-guard.mjs')).href}
          `);
          NODE
      - name: Build minimal and multilingual consumers
        run: |
          pnpm --dir examples/docs-minimal run build
          pnpm --dir examples/docs-features run build
      - name: Verify third-party notice sources before the website build
        run: node scripts/farm-docs-notices.test.mjs --source-only
      - name: Build the real website with its independent Farm configuration
        run: pnpm --dir website run build:farm
      - name: Verify published third-party notices
        run: node scripts/farm-docs-notices.test.mjs
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Exercise public theme, runtime, and full blog build/dev behavior
        run: >-
          node scripts/farm-docs-run-guarded.mjs
          scripts/farm-docs-full-list-theme.test.mjs
          scripts/farm-docs-admonition-labels.test.mjs
          scripts/farm-docs-blog-list-content.test.mjs
          scripts/farm-docs-theme.test.mjs
          scripts/farm-docs-runtime.test.mjs
      - name: Preserve build output, reports and native provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: farm-docs-${{ matrix.os }}-${{ github.run_attempt }}
          if-no-files-found: warn
          path: |
            website/build-farm
            examples/docs-minimal/build
            examples/docs-features/build
            docs/farm-docs/evidence/p10/ci
            ${{ runner.temp }}/farm-docs-native
