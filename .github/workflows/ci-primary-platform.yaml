name: Primary platform chain
on:
  workflow_call:
    inputs:
      os:
        required: true
        type: string
      abi:
        required: true
        type: string
      suite_selection_hash:
        type: string
        default: ''
    outputs:
      ts_artifact_id:
        value: ${{ jobs.ts-test.outputs.artifact_id }}
      ts_artifact_digest:
        value: ${{ jobs.ts-test.outputs.artifact_digest }}
      ts_run_attempt:
        value: ${{ jobs.ts-test.outputs.run_attempt }}
      browser_artifact_id:
        value: ${{ jobs.examples-test.outputs.artifact_id }}
      browser_artifact_digest:
        value: ${{ jobs.examples-test.outputs.artifact_digest }}
      browser_run_attempt:
        value: ${{ jobs.examples-test.outputs.run_attempt }}
permissions:
  contents: read
  actions: read
env:
  GH_TOKEN: ${{ github.token }}
jobs:
  native:
    uses: ./.github/workflows/rust-build-user.yaml
    with:
      platform: ${{ inputs.abi }}
    secrets: inherit

  native-disposition:
    name: Verify current native materialization
    if: always()
    needs: [native]
    runs-on: ${{ inputs.os }}
    steps:
      - name: Require successful per-product build or verified main artifact consumption
        env:
          NATIVE_RESULT: ${{ needs.native.result }}
        shell: bash
        run: test "$NATIVE_RESULT" = success

  docs:
    name: Docs CI quality checks
    if: always() && needs.native-disposition.result == 'success' && inputs.abi != 'darwin-arm64'
    needs: [native, native-disposition]
    uses: ./.github/workflows/farm-docs.yaml
    with:
      platforms: ${{ format('[{{"os":"{0}","abi":"{1}"}}]', inputs.os, inputs.abi) }}
      consume_native: true


  examples-test:
    outputs:
      artifact_id: ${{ steps.suite-upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.suite-upload.outputs.artifact-digest }}
      run_attempt: ${{ steps.suite-upload-origin.outputs.attempt }}
    name: Examples Test (${{ matrix.settings.os }})
    runs-on: ${{ matrix.settings.os }}
    if: always() && needs.native-disposition.result == 'success'
    needs: [native, native-disposition]
    strategy:
      fail-fast: false
      matrix:
        settings:
          - os: ${{ inputs.os }}
            abi: ${{ inputs.abi }}
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        if: inputs.suite_selection_hash != ''
        with:
          python-version: '3.13'
      - name: Restore original same-run suite selection
        if: inputs.suite_selection_hash != ''
        env:
          GH_TOKEN: ${{ github.token }}
          FARM_SUITE_SELECTION_HASH: ${{ inputs.suite_selection_hash }}
        run: python -B scripts/ci-suite-attempts.py --selection-only
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.4.0
          run_install: false
      - uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install Dependencies
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 60
          command: pnpm i --frozen-lockfile

      - name: Check real pnpm exec candidate entrypoints without lifecycle metadata
        run: node --test scripts/v2-pnpm-cli.test.mjs

      # run headless chrome install
      - name: Install headless chrome
        run: node node_modules/playwright-chromium/install.js

      - uses: actions/download-artifact@v4.1.3
        id: download
        with:
          name: ${{ github.sha }}-${{ matrix.settings.abi }}
          path: ./packages/core/binding

      - uses: actions/download-artifact@v4.1.3
        id: download-plugin-sass
        with:
          name: ${{ github.sha }}-${{ matrix.settings.abi }}-plugin-sass
          path: ./rust-plugins/sass/npm/${{ matrix.settings.abi }}

      - uses: actions/download-artifact@v4.1.3
        id: download-plugin-react
        with:
          name: ${{ github.sha }}-${{ matrix.settings.abi }}-plugin-react
          path: ./rust-plugins/react/npm/${{ matrix.settings.abi }}

      - uses: actions/download-artifact@v4.1.3
        id: download-plugin-replace-dirname
        with:
          name: ${{ github.sha }}-${{ matrix.settings.abi }}-plugin-replace-dirname
          path: ./rust-plugins/replace-dirname/npm/${{ matrix.settings.abi }}

      - uses: actions/download-artifact@v4.1.3
        id: download-plugin-vue
        with:
          name: ${{ github.sha }}-${{ matrix.settings.abi }}-plugin-vue
          path: ./rust-plugins/vue/npm/${{ matrix.settings.abi }}

      - uses: actions/download-artifact@v4.1.3
        id: download-plugin-vue-jsx
        with:
          name: ${{ github.sha }}-${{ matrix.settings.abi }}-plugin-vue-jsx
          path: ./rust-plugins/vue-jsx/npm/${{ matrix.settings.abi }}

      - uses: actions/download-artifact@v4.1.3
        id: download-plugin-auto-import
        with:
          name: ${{ github.sha }}-${{ matrix.settings.abi }}-plugin-auto-import
          path: ./rust-plugins/auto-import/npm/${{ matrix.settings.abi }}

      - uses: actions/download-artifact@v4.1.3
        id: download-plugin-compress
        with:
          name: ${{ github.sha }}-${{ matrix.settings.abi }}-plugin-compress
          path: ./rust-plugins/compress/npm/${{ matrix.settings.abi }}

      - uses: actions/download-artifact@v4.1.3
        id: download-plugin-dsv
        with:
          name: ${{ github.sha }}-${{ matrix.settings.abi }}-plugin-dsv
          path: ./rust-plugins/dsv/npm/${{ matrix.settings.abi }}

      - uses: actions/download-artifact@v4.1.3
        id: download-plugin-dts
        with:
          name: ${{ github.sha }}-${{ matrix.settings.abi }}-plugin-dts
          path: ./rust-plugins/dts/npm/${{ matrix.settings.abi }}

      - uses: actions/download-artifact@v4.1.3
        id: download-plugin-icons
        with:
          name: ${{ github.sha }}-${{ matrix.settings.abi }}-plugin-icons
          path: ./rust-plugins/icons/npm/${{ matrix.settings.abi }}

      - uses: actions/download-artifact@v4.1.3
        id: download-plugin-image
        with:
          name: ${{ github.sha }}-${{ matrix.settings.abi }}-plugin-image
          path: ./rust-plugins/image/npm/${{ matrix.settings.abi }}

      - uses: actions/download-artifact@v4.1.3
        id: download-plugin-mdx
        with:
          name: ${{ github.sha }}-${{ matrix.settings.abi }}-plugin-mdx
          path: ./rust-plugins/mdx/npm/${{ matrix.settings.abi }}

      - uses: actions/download-artifact@v4.1.3
        id: download-plugin-modular-import
        with:
          name: ${{ github.sha }}-${{ matrix.settings.abi }}-plugin-modular-import
          path: ./rust-plugins/modular-import/npm/${{ matrix.settings.abi }}

      - uses: actions/download-artifact@v4.1.3
        id: download-plugin-react-components
        with:
          name: ${{ github.sha }}-${{ matrix.settings.abi }}-plugin-react-components
          path: ./rust-plugins/react-components/npm/${{ matrix.settings.abi }}

      - uses: actions/download-artifact@v4.1.3
        id: download-plugin-strip
        with:
          name: ${{ github.sha }}-${{ matrix.settings.abi }}-plugin-strip
          path: ./rust-plugins/strip/npm/${{ matrix.settings.abi }}

      - uses: actions/download-artifact@v4.1.3
        id: download-plugin-svgr
        with:
          name: ${{ github.sha }}-${{ matrix.settings.abi }}-plugin-svgr
          path: ./rust-plugins/svgr/npm/${{ matrix.settings.abi }}

      - uses: actions/download-artifact@v4.1.3
        id: download-plugin-url
        with:
          name: ${{ github.sha }}-${{ matrix.settings.abi }}-plugin-url
          path: ./rust-plugins/url/npm/${{ matrix.settings.abi }}

      - uses: actions/download-artifact@v4.1.3
        id: download-plugin-virtual
        with:
          name: ${{ github.sha }}-${{ matrix.settings.abi }}-plugin-virtual
          path: ./rust-plugins/virtual/npm/${{ matrix.settings.abi }}

      - uses: actions/download-artifact@v4.1.3
        id: download-plugin-wasm
        with:
          name: ${{ github.sha }}-${{ matrix.settings.abi }}-plugin-wasm
          path: ./rust-plugins/wasm/npm/${{ matrix.settings.abi }}

      - uses: actions/download-artifact@v4.1.3
        id: download-plugin-worker
        with:
          name: ${{ github.sha }}-${{ matrix.settings.abi }}-plugin-worker
          path: ./rust-plugins/worker/npm/${{ matrix.settings.abi }}

      - uses: actions/download-artifact@v4.1.3
        id: download-plugin-yaml
        with:
          name: ${{ github.sha }}-${{ matrix.settings.abi }}-plugin-yaml
          path: ./rust-plugins/yaml/npm/${{ matrix.settings.abi }}

      - uses: actions/download-artifact@v4.1.3
        id: download-plugin-tailwindcss
        with:
          name: ${{ github.sha }}-${{ matrix.settings.abi }}-plugin-tailwindcss
          path: ./rust-plugins/tailwindcss/npm/${{ matrix.settings.abi }}

      # Same ci-profile native cohort as Core; never source-build a missing Docs plugin.
      - uses: actions/download-artifact@v4.1.3
        with:
          name: ${{ github.sha }}-${{ matrix.settings.abi }}-plugin-ssr-css
          path: ./rust-plugins/ssr-css/npm/${{ matrix.settings.abi }}
      - uses: actions/download-artifact@v4.1.3
        with:
          name: ${{ github.sha }}-${{ matrix.settings.abi }}-plugin-syntax-highlight
          path: ./rust-plugins/syntax-highlight/npm/${{ matrix.settings.abi }}
      - uses: actions/download-artifact@v4.1.3
        with:
          name: ${{ github.sha }}-${{ matrix.settings.abi }}-plugin-docs
          path: ./rust-plugins/docs/npm/${{ matrix.settings.abi }}
      - uses: actions/download-artifact@v4.1.3
        with:
          name: ${{ github.sha }}-${{ matrix.settings.abi }}-plugin-docs-snapshot
          path: ./rust-plugins/docs-snapshot/npm/${{ matrix.settings.abi }}
      - uses: actions/download-artifact@v4.1.3
        with:
          name: ${{ github.sha }}-${{ matrix.settings.abi }}-plugin-docs-seo
          path: ./rust-plugins/docs-seo/npm/${{ matrix.settings.abi }}
      - uses: actions/download-artifact@v4.1.3
        with:
          name: ${{ github.sha }}-${{ matrix.settings.abi }}-plugin-docs-snippets
          path: ./rust-plugins/docs-snippets/npm/${{ matrix.settings.abi }}
      - name: Build Examples - ${{ matrix.settings.abi }}
        env:
          FARM_SUITE_SELECTION_HASH: ${{ inputs.suite_selection_hash }}
          FARM_EXAMPLE_ABI: ${{ matrix.settings.abi }}
          FARM_SUITE_ABI: ${{ matrix.settings.abi }}
          FARM_EXAMPLE_PREBUILT_ONLY: '1'
        run: node scripts/test-examples.mjs

      - name: E2E Test Examples - ${{ matrix.settings.abi }}
        uses: nick-fields/retry@v3
        env:
          FARM_SUITE_SELECTION_HASH: ${{ inputs.suite_selection_hash }}
          FARM_SUITE_RESULTS_FILE: ci-suite-results/browser.json
          FARM_SUITE_ABI: ${{ matrix.settings.abi }}
        with:
          timeout_minutes: 60
          max_attempts: 1
          retry_wait_seconds: 10
          command: npm run test-e2e

      - name: Bind actual suite upload attempt
        id: suite-upload-origin
        shell: bash
        run: echo "attempt=$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - name: Preserve actual browser discovery and execution counts
        id: suite-upload
        uses: actions/upload-artifact@v4
        with:
          name: farm-ci-suite-browser-${{ github.sha }}-${{ matrix.settings.abi }}-${{ github.run_attempt }}
          path: ci-suite-results/browser.json
          if-no-files-found: error
          retention-days: 14

      # test create farm
      - name: Download Create Farm Rust - ${{ matrix.settings.abi }}
        uses: actions/download-artifact@v4.1.3
        with:
          name: ${{ github.sha }}-${{ matrix.settings.abi }}-create-farm
          path: ./packages/create-farm
      - name: Test Create Farm candidate packages - ${{ matrix.settings.abi }}
        id: create-farm-candidates
        run: pnpm run test:create-farm:candidates ${{ matrix.settings.abi }}
      - name: Preserve failed candidate diagnostics - ${{ matrix.settings.abi }}
        if: ${{ failure() && steps.create-farm-candidates.outputs.evidence != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: candidate-diagnostics-${{ github.sha }}-${{ matrix.settings.abi }}
          retention-days: 7
          path: |
            ${{ steps.create-farm-candidates.outputs.evidence }}/**/*.log
            ${{ steps.create-farm-candidates.outputs.evidence }}/**/producer.json
            ${{ steps.create-farm-candidates.outputs.evidence }}/**/result.json
            ${{ steps.create-farm-candidates.outputs.evidence }}/**/*-generated-package.json
            !${{ steps.create-farm-candidates.outputs.evidence }}/**/node_modules/**
      - name: Preserve actual cell receipt (shadow only)
        if: always()
        continue-on-error: true
        uses: ./.github/actions/ci-impact-cell
        with:
          cell: "examples:${{ matrix.settings.abi }}"
          status: ${{ job.status }}
          artifact-suffix: ${{ matrix.settings.abi || matrix.os || 'single' }}

  ts-test:
    outputs:
      artifact_id: ${{ steps.suite-upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.suite-upload.outputs.artifact-digest }}
      run_attempt: ${{ steps.suite-upload-origin.outputs.attempt }}
    # Vitest runs in node/forks; browser E2E jobs keep their downloads.
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    name: Typescript Test (${{ matrix.settings.os }})
    runs-on: ${{ matrix.settings.os }}
    if: always() && needs.native-disposition.result == 'success'
    needs: [native, native-disposition]
    strategy:
      fail-fast: false
      matrix:
        settings:
          - os: ${{ inputs.os }}
            abi: ${{ inputs.abi }}
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        if: inputs.suite_selection_hash != ''
        with:
          python-version: '3.13'
      - name: Restore original same-run suite selection
        if: inputs.suite_selection_hash != ''
        env:
          GH_TOKEN: ${{ github.token }}
          FARM_SUITE_SELECTION_HASH: ${{ inputs.suite_selection_hash }}
        run: python -B scripts/ci-suite-attempts.py --selection-only
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.4.0
          run_install: false
      - uses: actions/setup-node@v3
        with:
          node-version: 20
      - uses: actions/download-artifact@v4.1.3
        id: download-plugin-replace-dirname
        with:
          name: ${{ github.sha }}-${{ matrix.settings.abi }}-plugin-replace-dirname
          path: ./rust-plugins/replace-dirname/npm/${{ matrix.settings.abi }}
      - name: Install Dependencies
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 60
          max_attempts: 3
          retry_wait_seconds: 10
          command: pnpm i --frozen-lockfile
      - uses: actions/download-artifact@v4.1.3
        id: download
        with:
          name: ${{ github.sha }}-${{ matrix.settings.abi }}
          path: ./packages/core/binding
      - name: Prepare selected TypeScript suite dependencies
        env:
          FARM_SUITE_SELECTION_HASH: ${{ inputs.suite_selection_hash }}
          FARM_SUITE_ABI: ${{ matrix.settings.abi }}
        run: node scripts/ci-suite-preparation.mjs
      - name: Test - ${{ matrix.settings.abi }}
        env:
          FARM_SUITE_SELECTION_HASH: ${{ inputs.suite_selection_hash }}
          FARM_SUITE_ABI: ${{ matrix.settings.abi }}
        run: node scripts/ci-suite-execution.mjs
      - name: Preserve bounded TypeScript failure diagnostics without acceptance receipts
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: farm-ci-diagnostics-ts-${{ github.sha }}-${{ matrix.settings.abi }}-${{ github.run_attempt }}
          path: ci-suite-results/ts-failure.json
          if-no-files-found: warn
          retention-days: 14
      - name: Bind actual suite upload attempt
        id: suite-upload-origin
        shell: bash
        run: echo "attempt=$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - name: Preserve actual TypeScript discovery and execution counts
        id: suite-upload
        uses: actions/upload-artifact@v4
        with:
          name: farm-ci-suite-ts-${{ github.sha }}-${{ matrix.settings.abi }}-${{ github.run_attempt }}
          path: ci-suite-results/ts.json
          if-no-files-found: error
          retention-days: 14
      - name: Preserve actual cell receipt (shadow only)
        if: always()
        continue-on-error: true
        uses: ./.github/actions/ci-impact-cell
        with:
          cell: "ts-tests:${{ matrix.settings.abi }}"
          status: ${{ job.status }}
          artifact-suffix: ${{ matrix.settings.abi || matrix.os || 'single' }}
