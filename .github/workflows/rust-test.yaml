name: Unit Tests
on:
  workflow_dispatch:
    inputs:
      release_pr:
        description: Exact same-repository Changesets version PR
        required: true
        type: string
      release_base:
        description: Reviewed version preparation base SHA
        required: true
        type: string
  pull_request:
    branches:
      - main

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cargo-check:
    name: Check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v3
      - name: Install Rust
        uses: oxidecomputer/actions-rs_toolchain@oxide/master

      - name: Restore dependency sources without native target/profile reuse
        uses: ./.github/actions/cargo-source-cache
      - name: Fetch locked dependencies with bounded network retries
        timeout-minutes: 10
        env:
          CARGO_NET_RETRY: '3'
          CARGO_HTTP_TIMEOUT: '60'
        run: cargo fetch --locked
      - name: Run cargo check
        run: cargo check --locked --color always --all --all-targets
  cargo-test:
    name: Test - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install Rust
        uses: oxidecomputer/actions-rs_toolchain@oxide/master
        with:
          profile: minimal

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.4.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 60
          command: pnpm i --frozen-lockfile

      - name: Restore dependency sources without native target/profile reuse
        uses: ./.github/actions/cargo-source-cache
      - name: Fetch locked dependencies with bounded network retries
        timeout-minutes: 10
        env:
          CARGO_NET_RETRY: '3'
          CARGO_HTTP_TIMEOUT: '60'
        run: cargo fetch --locked
      - name: Run cargo test
        run: cargo test --locked --profile ci-test --tests
