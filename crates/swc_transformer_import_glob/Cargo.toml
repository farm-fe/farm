[package]
name = "farmfe_swc_transformer_import_glob"
version = "2.2.0"
edition = "2024"
authors = ["brightwwu(吴明亮) <1521488775@qq.com>"]
description = "farm swc tranformer for vite-style import.meta.glob"
license = "MIT"
homepage = "https://farmfe.org"
repository = "https://github.com/farm-fe/farm"
documentation = "https://docs.rs/farmfe_plugin_define"

[dependencies]
farmfe_ecosystem_glob = { path = "../../rust-ecosystem/glob", version = "=0.1.0" }
serde = { version = "1", features = ["derive"] }
url = "2"
farmfe_core = { path = "../core", version = "=2.2.0" }
farmfe_toolkit = { path = "../toolkit", version = "=2.2.0" }
farmfe_utils = { path = "../utils", version = "=2.1.1" }
farmfe_testing_helpers = { path = "../testing_helpers", version = "=2.2.0" }

[dev-dependencies]
tempfile = "3"
