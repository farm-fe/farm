[package]
license.workspace = true
edition = "2024"
name = "farmfe_node"
version = "0.0.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
# Default enable napi4 feature, see https://nodejs.org/api/n-api.html#node-api-version-matrix
napi = { version = "3.1.3", default-features = false, features = [
  "napi4",
  "serde-json",
] }
napi-derive = "3.1.1"
farmfe_compiler = { version = "=2.2.0", path = "../compiler" }
farmfe_core = { version = "=2.2.0", path = "../core" }
farmfe_toolkit = { version = "=2.2.0", path = "../toolkit" }
farmfe_toolkit_plugin_types = { version = "=2.2.0", path = "../toolkit_plugin_types" }
farmfe_plugin_resolve = { version = "=2.2.0", path = "../plugin_resolve" }
farmfe_docs_config = { path = "../../rust-ecosystem/docs-config" }
farmfe_docs_plan = { path = "../../rust-ecosystem/docs-plan" }
farmfe_docs_snapshot = { path = "../../rust-ecosystem/docs-snapshot" }
regex = "1"
libloading = "0.8.6"
eframe = { version = "0.24.1", default-features = false, features = [
  "persistence",
  "glow",
  "default_fonts",
], optional = true }
puffin_egui = { version = "0.24.0", optional = true }
notify = { version = "6.0.1", optional = true }

[features]
default = ["swc_plugin"]
profile = [
  "dep:eframe",
  "dep:puffin_egui",
  "farmfe_core/profile",
  "farmfe_compiler/profile",
]
swc_plugin = ["farmfe_compiler/swc_plugin"]
file_watcher = ["notify"]

[build-dependencies]
napi-build = "2.2.3"
